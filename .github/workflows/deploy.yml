name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, test, prod]
        default: dev
      migrate_legacy_ml_rbac:
        description: 'One-time: replace superseded A100/H100 storage-role identities'
        required: true
        type: boolean
        default: false
      migration_confirmation:
        description: 'Type the documented cleanup confirmation when migration is enabled'
        required: true
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ inputs.environment || 'dev' }}"
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "paramfile=infra/parameters/main.$ENV.bicepparam" >> "$GITHUB_OUTPUT"

      - name: az deployment sub validate (output suppressed)
        id: validate
        uses: azure/cli@v2
        env:
          AZ_SUB:    ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_TEN:    ${{ vars.AZURE_TENANT_ID }}
          AZ_LOC:    ${{ vars.AZURE_LOCATION }}
          MATRIX_HOSTNAME: ${{ secrets.MATRIX_HOSTNAME }}
          PARAMFILE: ${{ steps.env.outputs.paramfile }}
        with:
          azcliversion: latest
          inlineScript: |
            set +e
            az deployment sub validate \
              --location "$AZ_LOC" \
              --template-file infra/main.bicep \
              --parameters "$PARAMFILE" \
              > validate.raw 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error::validate failed (rc=$rc). Redacted excerpt:"
              sed \
                -e "s|$AZ_SUB|<SUB_ID>|g" \
                -e "s|$AZ_TEN|<TENANT_ID>|g" \
                -e "s|${MATRIX_HOSTNAME:-__none__}|<MATRIX_HOSTNAME>|g" \
                -e "s|mikkeyboi|<OWNER>|g" \
                -e "s|aif-aio-[a-z0-9-]*|<FOUNDRY_ACCT>|g" \
                -e "s|kv-aio-[a-z0-9-]*|<KV_NAME>|g" \
                -e "s|st[a-z0-9]*aio[a-z0-9]*|<ST_NAME>|g" \
                -e "s|rg-aio-[a-z0-9-]*|<RG_NAME>|g" \
                validate.raw | tail -c 8000
              exit $rc
            fi
            rm -f validate.raw
            echo "validate: OK"

      - name: az deployment sub what-if (summary only)
        id: whatif
        uses: azure/cli@v2
        env:
          AZ_SUB:    ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_TEN:    ${{ vars.AZURE_TENANT_ID }}
          AZ_LOC:    ${{ vars.AZURE_LOCATION }}
          MATRIX_HOSTNAME: ${{ secrets.MATRIX_HOSTNAME }}
          PARAMFILE: ${{ steps.env.outputs.paramfile }}
        with:
          azcliversion: latest
          inlineScript: |
            set +e
            az deployment sub what-if \
              --location "$AZ_LOC" \
              --template-file infra/main.bicep \
              --parameters "$PARAMFILE" \
              > whatif.raw 2>&1
            rc=$?
            creates=$(grep -c '^[[:space:]]*+ ' whatif.raw || true)
            modifies=$(grep -c '^[[:space:]]*~ ' whatif.raw || true)
            deletes=$(grep -c '^[[:space:]]*- ' whatif.raw || true)
            echo "what-if summary: +$creates creates / ~$modifies modifies / -$deletes deletes"
            if [ $rc -ne 0 ]; then
              echo "::error::what-if failed (rc=$rc). Redacted excerpt:"
              sed \
                -e "s|$AZ_SUB|<SUB_ID>|g" \
                -e "s|$AZ_TEN|<TENANT_ID>|g" \
                -e "s|${MATRIX_HOSTNAME:-__none__}|<MATRIX_HOSTNAME>|g" \
                -e "s|mikkeyboi|<OWNER>|g" \
                -e "s|aif-aio-[a-z0-9-]*|<FOUNDRY_ACCT>|g" \
                -e "s|kv-aio-[a-z0-9-]*|<KV_NAME>|g" \
                -e "s|st[a-z0-9]*aio[a-z0-9]*|<ST_NAME>|g" \
                -e "s|rg-aio-[a-z0-9-]*|<RG_NAME>|g" \
                whatif.raw | tail -c 8000
              exit $rc
            fi
            rm -f whatif.raw

      - name: Validate legacy ML RBAC cleanup request
        id: cleanup_request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_legacy_ml_rbac }}
        env:
          TARGET_ENV: ${{ inputs.environment }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
        run: |
          if [ "$TARGET_ENV" != "dev" ]; then
            echo "::error::Legacy ML RBAC cleanup is restricted to dev."
            exit 1
          fi
          if [ "$MIGRATION_CONFIRMATION" != "delete-superseded-a100-h100-storage-grants" ]; then
            echo "::error::Legacy ML RBAC cleanup confirmation did not match."
            exit 1
          fi

      - name: Remove superseded A100/H100 storage grants
        id: cleanup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_legacy_ml_rbac && inputs.environment == 'dev' }}
        continue-on-error: true
        uses: azure/cli@v2
        env:
          AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ENV_NAME: ${{ inputs.environment }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
        with:
          azcliversion: latest
          inlineScript: |
            python3 scripts/cleanup_legacy_ml_rbac.py \
              --environment "$ENV_NAME" \
              --confirm "$MIGRATION_CONFIRMATION"

      - name: az deployment sub create (status only)
        id: deploy
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.whatif.outcome == 'success' && steps.cleanup_request.outcome != 'failure' }}
        uses: azure/cli@v2
        env:
          AZ_SUB:    ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_TEN:    ${{ vars.AZURE_TENANT_ID }}
          AZ_LOC:    ${{ vars.AZURE_LOCATION }}
          MATRIX_HOSTNAME: ${{ secrets.MATRIX_HOSTNAME }}
          PARAMFILE: ${{ steps.env.outputs.paramfile }}
          ENV_NAME:  ${{ steps.env.outputs.env }}
        with:
          azcliversion: latest
          inlineScript: |
            set +e
            DEPLOY_NAME="aio-${ENV_NAME}-$(date -u +%Y%m%d-%H%M%S)"
            az deployment sub create \
              --name "$DEPLOY_NAME" \
              --location "$AZ_LOC" \
              --template-file infra/main.bicep \
              --parameters "$PARAMFILE" \
              --output none \
              > create.raw 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error::deploy failed (rc=$rc). Redacted excerpt:"
              sed \
                -e "s|$AZ_SUB|<SUB_ID>|g" \
                -e "s|$AZ_TEN|<TENANT_ID>|g" \
                -e "s|${MATRIX_HOSTNAME:-__none__}|<MATRIX_HOSTNAME>|g" \
                -e "s|mikkeyboi|<OWNER>|g" \
                -e "s|aif-aio-[a-z0-9-]*|<FOUNDRY_ACCT>|g" \
                -e "s|kv-aio-[a-z0-9-]*|<KV_NAME>|g" \
                -e "s|st[a-z0-9]*aio[a-z0-9]*|<ST_NAME>|g" \
                -e "s|rg-aio-[a-z0-9-]*|<RG_NAME>|g" \
                create.raw | tail -c 8000
              rm -f create.raw
              exit $rc
            fi
            rm -f create.raw
            # Print only the deployment name (no IDs, no params, no outputs).
            echo "deploy: SUCCESS  name=$DEPLOY_NAME  env=$ENV_NAME"

      - name: Preserve cleanup failure after convergence attempt
        if: ${{ always() && steps.cleanup.outcome == 'failure' }}
        run: |
          echo "::error::Legacy ML RBAC cleanup failed; convergence deployment was still attempted."
          exit 1

      # NOTE: deploy-output-sanitized.json artifact upload removed. Even with
      # `jq` filtering, the deployment output contains resource IDs (and thus
      # subscription ID, RG name, hostnames). Run `az deployment sub show -n
      # <name>` locally if you need full output.
